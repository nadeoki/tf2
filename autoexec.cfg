// ----------------------------------------------------------------------------
// Nadeoki's Config 1.9 - Made with love for the game
// https://github.com/nadeoki/tf2
//
// please check "gfx.cfg" to change parameters depending on your Hardware
// You can leave most things as it is. Though some stuff is preference and
// you might want to adjust stuff to your liking if you know what you're doing.
// 
// You can adjust your sensitivity with "sens1.cfg" and "sens2.cfg" 
// and load them conveniently via the console ingame. This way you can
// have two seperate sensitivities. (useful for Dodgeball).
// Additionally, take care to look at the Github's readme, as it has most of the
// necessary information.
//
// Adjust your binds inside of binds.cfg or remove binds.cfg along with the exec
// command at the bottom of this config.
// ----------------------------------------------------------------------------
// Network Setting Defaults - class cfg take care of this. 
// ----------------------------------------------------------------------------
// exec 66tick
// ----------------------------------------------------------------------------
// uncomment this one for casual play to have sane default values provided.
// note that class-configs SHOULD be utilized to adjust class-based interp
// as hit-scan and projectile based classes behave differently on certain lerp
// settings. (generally 15.2ms for projectile and 34ms for hitscan)
// ----------------------------------------------------------------------------
// exec 128tick
// ----------------------------------------------------------------------------
// 128 tick servers - uncomment for use on 128 tick servers. Only works without
// class configs. You can comment inside of pyro class cfg to disable it for
// db on 128 tick
// ----------------------------------------------------------------------------
exec tfdb
// ----------------------------------------------------------------------------
// These settings were provided by blind, referencing pluto's optimizations.
// their efficacy are debatable but they seemingly improve stability on 1ms lerp
// so good for local server and good for servers that allow 1ms lerp (placebo)
// like UDL
// ----------------------------------------------------------------------------
// Network Settings - you can alternatively use command alias to trigger
// either of the configs but all of them MUST remain commented for it to work
// properly. And you have to join SPEC or rejoin the server to trigger it.
// ----------------------------------------------------------------------------
alias "66tick" exec 66tick
alias "128tick" exec 128tick
alias "tfdb" exec tfdb
alias "sens1" exec sens1
alias "sens2" exec sens2
// ----------------------------------------------------------------------------
// network smoothing and lag comp - keep as is unless you know what you're doing
// ----------------------------------------------------------------------------
//cl_lagcompensation 1
//cl_pred_optimize 2
//cl_smooth -1
//cl_smooth 1
//cl_smoothtime 0.01
//rate 25000000 // should be 60% of your stable upload speed in bytes
// ----------------------------------------------------------------------------
//Probably needed for confilter to work
con_enable 1
developer 0
// ----------------------------------------------------------------------------
// Sensitivity | edit sens1.cfg or sens2.cfg | switch either ingame or here.
// ----------------------------------------------------------------------------
// exec sens2
// ----------------------------------------------------------------------------
m_pitch 0.02// defines vertical sensitivity multiplier. default is 0.02
m_yaw 0.02 // defines horizontal sensitivity multiplier. default is 0.02
m_filter 0 // Do not average mouse input over two frames, more responsive mouse input
// m_filter 0 // 1= Average mouse input over two frames, more stable mouse input with high FPS variability
m_mousespeed 0 // Disable Windows mouse acceleration (-noforcemspd)
m_mouseaccel1 0 // ^ (-noforcemaccel)
m_mouseaccel2 0 // ^ (-noforcemaccel)
//m_customaccel 0
m_rawinput 1
zoom_sensitivity_ratio 0.7934714 // Use same sensitivity as when unscoped

// ----------------------------------------------------------------------------
// FOV - keep in mind this will affect your sensitivity
// ----------------------------------------------------------------------------
fov_desired "90"
// ----------------------------------------------------------------------------
// FPS cap
//
// The primary benefit of an FPS cap is to make the FPS more 
// stable, other than that, it doesn't do a lot. A moderate, consistent 
// framerate is much more desirable than a variable but sometimes 
// high framerate. A common misconception is that if any more 
// frames are generated than your monitor can display, it won't be beneficial.
// This belief is WRONG due to how input delay works.
// ----------------------------------------------------------------------------
fps_max 1000
// ----------------------------------------------------------------------------
// Binds - use Custom binds section at the bottom for your own binds
// ----------------------------------------------------------------------------
bind k "kill"
bindtoggle "ctrl" "r_drawviewmodel" 0 0 1;
bind "shift" "toggle tf_use_min_viewmodels"
ds_notify 2
bind DEL "ds_record"
bind HOME "stop"
// ----------------------------------------------------------------------------
// Alias
// ----------------------------------------------------------------------------
Alias "addtime" "ent_fire team_round_timer addtime 500000"
bind f "sm_grab"
// ----------------------------------------------------------------------------
// Map Downloads
// ----------------------------------------------------------------------------
cl_allowdownload 2;
cl_allowupload 1; 
cl_downloadfilter all;
// ----------------------------------------------------------------------------
// Additional configs that launch at startup or at autoexec execution.
// ----------------------------------------------------------------------------
exec confilter
exec gfx
exec binds
exec custom
exec crosshair
exec null // makes it so you don't stop when pressing A + D
//exec bugfix
//exec tfdb_sidedrag
// ----------------------------------------------------------------------------
