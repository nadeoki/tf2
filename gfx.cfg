// ============================================================================
// Nadeoki's Graphics Config 1.9
// ============================================================================
// This includes all the visual and performance related changes to to tf2
// some things are work-in-progress. Only change if you know what you're 
// doing. I suggest reading at least through the first few sections as they
// differ in performance based on the hardware you have
// ============================================================================
sv_cheats 1 // Prevent fog cvar spew in console on startup
// -------------------------------------------------------
// Steam Cloud Sync (enable/disable)
// ---------------------------------
cl_cloud_settings 0 // I believe this disables cloud syncing of CFGs but not 100% sure
// ----------------------------------------------------------------------------
// For Laptop Users
// ----------------
cl_showbattery 0 // 1 for laptops
// ------------------------------
// Player Spray
// ------------
// Network Optimizations
// =====================
// net_queued_packet_thread 1 // Queue split packets
net_maxpacketdrop 1000 // Use faster packet drop threshold
//net_maxpacketdrop 5000 // Use default packet drop threshold
//net_splitrate 2 // Split 2 packets per frame, reduces choke with a bit of CPU
                // usage
net_splitrate 4 // Split 4 packets per frame, reduces choke but is more CPU
                  // intensive
//net_splitrate 1 // Do not split multiple packets for bad CPUs that cannot
                  // handle the extra load
cl_pred_optimize 2 // Reuse prediction data in case 1, as well as if the
                     // the server said our prediction data was within
                     // reasonable limits of its own data (case 2)
net_graphsolid 0 // draw height ticks as single ticks (small optimization)
net_graphshowlatency 1 // show the latency part of the graph
net_graphshowinterp 1 // show the interpolation part of the graph
hud_escort_interp 0.1 // Smooth out networked HUD updates over slightly less time
net_compresspackets 1 // Compress packets to reduce network latency on fast
                        // CPUs
//net_compresspackets 0 // Disable packet compression on slow CPUs or very fast
                        // networks (~100Mbps up or higher)
//net_compresspackets_minsize 957 // Compress packets above max reliable packet
                                  // size
net_compresspackets_minsize 576 // Always compress packets to reduce network
                                  // usage. Compression further than this may
                                  // increase packet size
//net_maxroutable 1200;net_maxfragments 1200 // Balance between reliability and
                                             // avoiding split packets
net_maxroutable 956;net_maxfragments 956 // Use a reliable packet size for
                                           // routers that have trouble with
                                           // larger sizes
//net_maxroutable 1260;net_maxfragments 1260 // Use max allowable packet size to
                                             // avoid split packets more in
                                             // order to save CPU time and
                                             // packet overhead
net_maxcleartime 0.0081889
cl_localnetworkbackdoor 1 // Network optimizations for local servers
net_usesocketsforloopback 0 // Skip using network sockets for local servers
sv_parallel_sendsnapshot 1 // Send snapshots to clients in parallel
// =============================================================================
// -- Memory allocation
// =============================================================================
mem_max_heapsize_dedicated 128 // Maximum amount of memory to dedicate to engine hunk and datacache, for dedicated server (in mb)
mem_max_heapsize 320
lzma_persistent_buffer 1 // Keep the LZMA compression system in memory to prevent reloads of it
cl_always_flush_models 1 // Keep models loaded in between map loads and prevent crashes from model flushing
//cl_always_flush_models 1 // Remove models from memory every map load to keep memory usage low
mat_levelflush 1 // Clear temporary memory to prevent overloading memory stores
mat_bufferprimitives 1 // Skip flushing of primitives when meshes draw
filesystem_buffer_size 8192 // Use a 8KB buffer for the filesystem
filesystem_max_stdio_read 64 // Use a higher max read cap (64MB)
filesystem_native 1 // Use native filesystem calls if available
filesystem_unbuffered_io 0 // (1) uses Unbuffered I/O for older systems

// =============================================================================
// --- Matchmaking ---                        
// =============================================================================
tf_mm_debug_level 0 // Remove matchmaking debug output
tf_party_keep_on_same_team 1 // enforce parties being on the same team


// Enable/Disable Player Viewmodel Portrait
// ----------------------------------------------------------------------------
cl_hud_playerclass_use_playermodel 0
// ----------------------------------------------------------------------------
// GPU Settings
// ----------------------------------------------------------------------------
mat_clipz 1
// ----------------------------------------------------------------------------
// CPU based settings 
// Use 1 on all of these if you have a MultiCore CPU. Disable on 4 Core or Less.
// ----------------------------------------------------------------------------
cl_threaded_client_leaf_system 1 // Free up resources from Main Thread
r_queued_ropes 1 // takes rope & wire rendering off main thread
r_queued_post_processing 0 // Post processing moved off Main Thread (causes flickering on custom maps)
r_queued_decals 1 // // Offload decal draws to the material system
r_threaded_particles 1 // Process particle systems in parallel
r_threaded_renderables 1 // process renderable objects off Main Thread
r_threaded_client_shadow_manager 1 // process shadows off Main Thread

mod_load_anims_async 1           
mod_load_mesh_async 1             
mod_load_vcollide_async 1  
// ----------------------------------------------------------------------------
// Server relevant
// ----------------------------------------------------------------------------
host_thread_mode 2 // 1 multi-thread 0= single-thread
// ----------------------------------------------------------------------------
// Mat Queue // IMPORTANT!
// ----------------------------------------------------------------------------
mat_queue_mode 2
// ----------------------------------------------------------------------------
//mat_queue_mode 1 // Force queued single threaded mode for CPUs with less than
// 4 threads
//
// mat_queue mode is another frequently asked about cvar, it
// defines the threading method to be used by the material
// system. It has been unstable to use in the past, but
// nowadays it's generally okay.
//
// Here are the possible values:
//     -2 legacy default
//     -1 default
//      0 synchronous single thread
//      1 queued single thread
//      2 queued multithreaded
//
// If you have problems with the value `2', try setting it to `-1'.
//
// As an aside, there are quite a few bugs in the demo system
// that occur when mat_queue_mode is set to a value that is
// not `-1'. If you intend to do work with the demo system,
// maybe you should change this.
//
// After immense testing it's been shown that default works 
// perfectly fine with setting your Thread usage. It
// automatically set me
// to 2 every time. I'd say it's safer and likely less buggy to
// leave this at -1 than it is at 2.
//
// As a side not I've noticed micro stutters 
// with mat_queue_mode 2 
// at 1000+ fps where mat_queue_mode 1 did 
// not stutter at 1000+ //fps
// ----------------------------------------------------------------------------
// mat_vsync 0 // does what you think
// ----------------------------------------------------------------------------
// Antialias Settings
// ----------------------------------------------------------------------------
mat_antialias 0 // disable if modern GPU uses driver-level AA or Supersampling
                // enable AA override in AMD / Nvidia Drivers.
                // disable AA - FXAA, i recommend enabling AA - Gamma Correction too.
                // requires dx11 (-dxlevel 110)
mat_aaquality 2 // not used if mat_antialias is set to 0
mat_software_aa_blur_one_pixel_lines 1
mat_software_aa_edge_threshold 0.8  
mat_bumpmap 0 // Controls bumpmapping. Setting this to 0 on dx9 will cause
             // a strange `shine' effect to appear on all players. - Chris
            // In the past I wasn't able to prove that disabling this was significant, 
            // it effects fps by about 1% after several checks - Comanglia
// ----------------------------------------------------------------------------
// Mat Phong Stuff
// ----------------------------------------------------------------------------
mat_specular 1 // 1 makes australiums shiny with mat_phong 0 enabled
mat_phong 0 // turns off shiny textures like australiums, use specular to fix
r_worldlights 1  
// ----------------------------------------------------------------------------
// Shadows
// ----------------------------------------------------------------------------
r_shadows 1 // disables entity shadows
r_shadowmaxrendered 2 // amount of dynamic shaders allowed			
r_shadowrendertotexture 0 // define shader complexity 0 = simple 1 = textured		
nb_shadow_dist 300 // 400 default. increase rendered shadows by distance
cl_blobbyshadows 0 // renders shadows as a blob (works differently from normal shadow)
r_flashlightrender 1 // rendering flashlight / pyro flame / pda flash etc.
// ----------------------------------------------------------------------------
// Disable facial features
// ----------------------------------------------------------------------------
r_eyes 0			
r_eyemove 0
r_eyesize 0
r_eyeshift_x 0
r_eyeshift_y 0
r_eyeshift_z 0
r_eyesize 0
r_eyeshift_x 0
blink_duration 0
r_teeth 0 
r_flex 0 // Disable facial animation
flex_rules 0 // Disable facial animations
flex_smooth 0 // Do not smooth facial animations
ai_expression_frametime 0.0151
mp_usehwmmodels -1 // Do not use or load high quality characters
mp_usehwmvcds -1 // Do not use or load high quality character facial
                   // expressions
ai_expression_optimization 1 // optimized facial expression
ai_expression_frametime 1 // Disable expressions if we are below ideal
                                 // FPS   
// ----------------------------------------------------------------------------
r_root 0
r_rootlod 1 // defines animations according to LoD
r_lod -1 // dynamic LoD switching based on distance. higher = HQ lower = LQ
lod_transitiondist 200 // distance to trigger dynamic LoD.
// ----------------------------------------------------------------------------
// Ragdoll
// ----------------------------------------------------------------------------
cl_SetupAllBones 0 // animation updates every frame (0) only partial
cl_ragdoll_fade_time 0 // how long ragdoll is visible after death		
cl_ragdoll_forcefade 1	// instantly fade ragdolls	
cl_ragdoll_physics_enable 0	// disable ragdoll entirely						
ragdoll_sleepaftertime 0 // disables ragdoll interaction after no interaction happens	
// ----------------------------------------------------------------------------
// Gibs
// ----------------------------------------------------------------------------
cl_phys_props_enable 1 // enable interactable props	    
cl_phys_props_max 32 // how many dynamic props will be rendered
props_break_max_pieces 0 // how many pieces broken props turn into	
prop_active_gib_limit 0 // limits amount of gibs rendered 
r_propsmaxdist 500 // distance at which props remain visible		
violence_agibs 0 // general gore
violence_hgibs 0 // heads gore
cl_burninggibs 0 // burning gore gibs
props_break_max_pieces_perframe 0 // how many gibs per second
// ----------------------------------------------------------------------------
// Audio (Low Q supposedly better for comp)
// ----------------------------------------------------------------------------
snd_musicvolume 0 // Set music volume
snd_mute_losefocus 0 // alt-tab doesn't mute the game

dsp_enhance_stereo 0 // enables stereo-seperation					
dsp_slow_cpu 0 // reduce CPU load on audio processing
dsp_spatial 1 // 0 = off 1 = simple 2 = advanced (any value increases weight)
dsp_water 0 // Disable water muffling effect
dsp_room 0 // Enable automatic DSP, adjusts DSP according to the room type/size you are in

snd_pitchquality 2 // 0 = lq 1 = mq 2 = hq (negligable on modern systems)
snd_disable_mixer_duck 1 // Disable some sounds being mixed to be louder than others
snd_surround_speakers 0 // 0=Stereo / 1=Quad / 2=5.1 / 3=7.1 / 4=for advanced virtualization

snd_spatialize_roundrobin 3 // higher = more processing for directional 3D clarity
snd_mixahead 0.1 // Delay in sound from weapons below 0.05 has been known to be unstable                        
snd_mix_async 1 // Use another thread to mix sounds
snd_async_fullyasync 1 // Having the sound run fully asynchronous has been
                       // helpful in the past, as it seems to (for whatever
                       // reason) reduce the number of TDRs experienced during
                       // gameplay. There's some pretty good information on
                       // TDRs (nerds only) here:
                       // http://forums.nvidia.com/index.php?showtopic=65161
snd_async_minsize 1 // Fast async check when snd_async_fullyasync is enabled
phonemedelay 0 // Do not delay lip sync a lot with an async sound system
//snd_delay_sound_shift 0.03 // Allow for more variance in sounds processing
                             // delays on slow CPUs
voice_steal 2 // Reuse unimportant sound channels, increases FPS and sound quality
snd_noextraupdate 1 // 1 causes desync on very high fps 1000+ ?
snd_async_spew_blocking 0 // Disable async spew log
// ----------------------------------------------------------------------------
cl_drawmonitors 1				
cl_jiggle_bone_framerate_cutoff 60 // Disable jigglebones if we are under the optimal framerate

cl_new_impact_effects 0	// affect quality of bulletholes		
cl_show_splashes 0 // render splashes on water					
func_break_max_pieces 0	// how many pieces a breakable debrid can be			
glow_outline_effect_enable 1 					
// ----------------------------------------------------------------------------
mat_picmip 2 // Higher = more mipmapping. Without `sv_cheats 1', you're
             // looking at a range from
             // -1 to 2, -1 being the best quality, 2 being the
             // worst. - Doesn't really matter much what you set this too if 
             // you're cpu bound
// ----------------------------------------------------------------------------
